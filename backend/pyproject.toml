[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wbs-api"
version = "0.1.0"
description = "Tenant-aware FastAPI backend for the WBS generator"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
  "httpcore[asyncio]==1.0.9",
  "defusedxml==0.7.1",
  "openpyxl==3.1.5",
  "pydantic-settings>=2.7,<3",
  "prometheus-client>=0.21,<1",
  "pgvector>=0.4,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pypdf==6.21.2",
  "pdfplumber==0.11.10",
  "pdfminer.six==20260107",
  "pypdfium2==5.14.0",
  "python-docx==1.2.0",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]
agent-qualification = [
  "langgraph==1.2.18",
  "langgraph-checkpoint==4.3.1",
  "langgraph-checkpoint-sqlite==3.1.2",
]
worker = [
  "langgraph==1.2.18",
  "langgraph-checkpoint==4.3.1",
  "fastembed==0.9.0",
  "flatbuffers==25.12.19",
  "huggingface-hub==1.33.0",
  "loguru==0.7.3",
  "mmh3==5.3.1",
  "numpy==2.5.4",
  "onnxruntime==1.31.0",
  "pillow==12.3.0",
  "protobuf==7.36.2",
  "py-rust-stemmers==0.1.8",
  "requests==2.34.2",
  "tokenizers==0.22.2",
  "tqdm==4.70.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
