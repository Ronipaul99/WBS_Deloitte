name: Full-stack security verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wbs_fullstack
          POSTGRES_USER: wbs_fullstack
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wbs_fullstack -d wbs_fullstack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]" pip-audit

      - name: Backend lint
        working-directory: backend
        run: ruff check app tests migrations

      - name: Backend tests
        working-directory: backend
        run: python -m pytest

      - name: Validate production configuration gate
        working-directory: backend
        env:
          APP_ENV: production
          AUTH_MODE: local
          AUTH_JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-bytes
          AUTH_AUDIT_SECRET: ci-only-audit-secret-independent-and-32-bytes
          AUTH_COOKIE_SECURE: 'true'
          AUTO_CREATE_TABLES: 'false'
          DATABASE_URL: postgresql://runtime:ci-only@db.example.invalid/wbs?sslmode=require
          DIRECT_DATABASE_URL: postgresql://migration:ci-only@db.example.invalid/wbs?sslmode=require
          CORS_ORIGINS: https://wbs.example.invalid
          PUBLIC_UI_URL: https://wbs.example.invalid
          FORWARDED_ALLOW_IPS: 10.0.0.0/8
          READINESS_REQUIRE_MIGRATION_HEAD: 'true'
          METRICS_ENABLED: 'true'
          METRICS_BEARER_TOKEN: ci-only-metrics-token-that-is-at-least-32-bytes
          DEV_USER_PASSWORD: ''
          PASSWORD_RECOVERY_ENABLED: 'false'
          TENANT_INVITATIONS_ENABLED: 'false'
        run: python -m app.cli check-production-config

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: WBS_UI/package-lock.json

      - name: Install frontend
        working-directory: WBS_UI
        run: npm ci

      - name: Frontend lint
        working-directory: WBS_UI
        run: npm run lint

      - name: Frontend build
        working-directory: WBS_UI
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: WBS_UI
        run: npx playwright install --with-deps chromium

      - name: Verify migrations and schema drift
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://wbs_fullstack@127.0.0.1:5432/wbs_fullstack
          DIRECT_DATABASE_URL: postgresql+asyncpg://wbs_fullstack@127.0.0.1:5432/wbs_fullstack
          DATABASE_USE_NULL_POOL: 'true'
          AUTO_CREATE_TABLES: 'false'
          BOOTSTRAP_DEVELOPMENT_DATA: 'false'
        run: |
          alembic upgrade head
          alembic check

      - name: Run live PostgreSQL browser suite
        working-directory: WBS_UI
        env:
          FULLSTACK_DATABASE_URL: postgresql+asyncpg://wbs_fullstack@127.0.0.1:5432/wbs_fullstack
          FULLSTACK_DATABASE_DISPOSABLE_ACK: I_ACKNOWLEDGE_THIS_DATABASE_IS_DISPOSABLE
          FULLSTACK_PRESERVE_FAILURE_ARTIFACTS: 'true'
        run: npm run test:e2e:fullstack

      - name: Scan Python dependencies
        working-directory: backend
        run: pip-audit

      - name: Scan production npm dependencies
        working-directory: WBS_UI
        run: npm audit --omit=dev --audit-level=high

      - name: Build backend container
        run: docker build --tag wbs-api-ci:${{ github.sha }} backend

      - name: Build frontend container
        run: >-
          docker build
          --build-arg VITE_API_URL=https://api.example.invalid/api/v1
          --tag wbs-ui-ci:${{ github.sha }}
          WBS_UI

      - name: Scan backend container
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: wbs-api-ci:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Scan frontend container
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: wbs-ui-ci:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Prepare release evidence
        run: mkdir -p release-evidence

      - name: Generate backend SBOM
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: wbs-api-ci:${{ github.sha }}
          format: cyclonedx
          output: release-evidence/backend-sbom.cdx.json

      - name: Generate frontend SBOM
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: wbs-ui-ci:${{ github.sha }}
          format: cyclonedx
          output: release-evidence/frontend-sbom.cdx.json

      - name: Record immutable image evidence
        run: |
          git rev-parse HEAD > release-evidence/source-revision.txt
          docker image inspect wbs-api-ci:${{ github.sha }} --format='{{.Id}}' > release-evidence/backend-image-id.txt
          docker image inspect wbs-ui-ci:${{ github.sha }} --format='{{.Id}}' > release-evidence/frontend-image-id.txt

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-security-evidence
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Upload sanitized browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-failure-evidence
          path: |
            WBS_UI/test-results-fullstack/**/*.png
            WBS_UI/test-results-fullstack/**/sanitized-network-summary*
          if-no-files-found: ignore
          retention-days: 7
