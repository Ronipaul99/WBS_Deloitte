# Same-origin HTTPS entry point for the Oracle VM domain.
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format path_only '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout path_only;
    error_log /dev/stderr warn;
    server_tokens off;
    sendfile on;
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    map $uri $cache_policy {
        default "no-store";
        ~^/assets/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        server_name wbsgenie.duckdns.org 144.24.43.125;
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }
        location / {
            return 308 https://wbsgenie.duckdns.org$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        server_name 144.24.43.125;
        ssl_certificate /etc/nginx/tls/wbs-ip/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/wbs-ip/privkey.pem;
        return 308 https://wbsgenie.duckdns.org$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name wbsgenie.duckdns.org;
        ssl_certificate /etc/nginx/tls/wbs-domain/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/wbs-domain/privkey.pem;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 26m;
        client_body_timeout 60s;
        keepalive_timeout 30s;
        send_timeout 120s;
        set $api_upstream http://api:8000;

        add_header Cache-Control $cache_policy always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }

        location = /api/v1/health/metrics {
            return 404;
        }

        location = /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass $api_upstream;
        }

        location /api/ {
            proxy_pass $api_upstream;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location ~ /\. {
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
